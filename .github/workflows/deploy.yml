name: Deploy to GitHub Pages

# Builds the offline PWA (kitchen-tool-src/dist/pwa), runs the smoke tests against it
# (failures show in the run but don't block), and publishes it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kitchen-tool-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build (fetches three@0.128.0 from npm)
        run: python build.py --pwa
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Smoke tests (reported, not blocking the deploy)
        continue-on-error: true
        run: python tests/smoke_test.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kitchen-tool-src/dist/pwa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
